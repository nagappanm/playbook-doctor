# Ported verbatim from the Week 5 lab (self-healing-framework-playwright).
# Deliberately unchanged: the point of the capstone is that the guardrails you
# already built transfer to a new project without redesign.
repos:
  # 1. Black (formatter)
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  # 2. Ruff (linter + type checker)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
      - id: ruff-format

  # 3. detect-secrets (secret scanner)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # 4. semgrep (security linter)
  - repo: https://github.com/semgrep/semgrep
    rev: v1.165.0
    hooks:
      - id: semgrep
        args: ["--config=auto"]
