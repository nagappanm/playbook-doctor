# Week 5 guardrails: format, lint, and secret-scanning run on every commit.
# https://pre-commit.com  —  install with `pre-commit install`.
#
# Pin the `rev:` values to the versions you actually run, then generate the
# secrets baseline once with:  detect-secrets scan > .secrets.baseline
repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
