[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playbook-doctor"
version = "0.1.0"
description = "Audit a repository against the AI-engineering playbook and score its agent-readiness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[project.scripts]
playbook-doctor = "playbook_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["playbook_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
# Pinned to the minimum supported interpreter. Without this, Black infers the
# target from the running Python and its AST-equivalence safety check fails
# whenever the local interpreter is older than the inferred target.
target-version = ["py310"]
